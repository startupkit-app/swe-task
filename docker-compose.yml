services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  mock-api:
    build: ./services/mock-api
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m

  candidate-app:
    build:
      context: ./services/app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      MOCK_API_URL: http://mock-api:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: candidate-app
      LOG_LEVEL: info
      PORT: "8080"
    depends_on:
      redis:
        condition: service_healthy
      mock-api:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m

  test-runner:
    build: ./services/test-runner
    environment:
      APP_URL: http://candidate-app:8080
      MOCK_API_URL: http://mock-api:8080
      JAEGER_QUERY_URL: http://jaeger:16686
      REDIS_URL: redis://redis:6379
    depends_on:
      candidate-app:
        condition: service_healthy
    profiles: ["test"]
