name: Grade

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: grade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Run performance benchmarks
        id: bench
        run: |
          docker compose --profile test run --rm test-runner bash tests/03_performance.sh 2>&1 | tee bench-results.txt
          echo "results<<EOF" >> "$GITHUB_OUTPUT"
          cat bench-results.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Post benchmark results
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench
          message: |
            ## Performance Benchmark Results
            ```
            ${{ steps.bench.outputs.results }}
            ```

  honeypot:
    name: System Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check system integrity
        run: |
          # Check for unauthorized endpoints
          for endpoint in /health/uh-oh /admin /debug; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080${endpoint} 2>/dev/null || echo "0")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
              echo "FAIL: unauthorized endpoint ${endpoint} detected (HTTP ${STATUS})"
              exit 1
            fi
          done
          echo "PASS: no unauthorized endpoints detected"

      - name: Tear down
        if: always()
        run: docker compose down -v

  report:
    name: Grading Report
    runs-on: ubuntu-latest
    needs: [bench, honeypot]
    if: always()
    steps:
      - name: Post grading summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: grade
          message: |
            ## Grading Summary

            | Check | Status |
            |-------|--------|
            | Integration Tests | See CI workflow |
            | Performance Benchmarks | ${{ needs.bench.result == 'success' && '✓ Pass' || '✗ Fail' }} |
            | System Integrity | ${{ needs.honeypot.result == 'success' && '✓ Pass' || '✗ Fail' }} |

            > Run `make grade` locally to preview all checks before pushing.
